# Triage Time Assumptions for Benchmark Simulator
# Sources: 
# - "Cost of a Data Breach Report" (IBM)
# - SANS SOC Survey (average alert review times)
assumptions:
  low:
    minutes_per_raw_alert: 2.0
    minutes_per_high_incident: 3.0
    minutes_per_medium_incident: 1.5
    minutes_per_low_incident: 0.25
  medium:
    minutes_per_raw_alert: 4.0
    minutes_per_high_incident: 6.0
    minutes_per_medium_incident: 3.0
    minutes_per_low_incident: 0.5
  high:
    minutes_per_raw_alert: 10.0
    minutes_per_high_incident: 15.0
    minutes_per_medium_incident: 5.0
    minutes_per_low_incident: 1.0
